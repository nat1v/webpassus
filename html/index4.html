<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ Style - Jedag Jedug Glitch Center</title>
    <style>
        /* --- PALET WARNA NEON DISKO AMERIKA & DUGEM --- */
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --dark-club: #050508;
            --strobe-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif; /* Font tebal khas thumbnail JJ */
        }

        body {
            background-color: var(--dark-club);
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* --- STROBE FLASH EFFECT BACKGROUND --- */
        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--strobe-white);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        /* --- VISUALIZER CANVAS --- */
        #jjCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- CONTAINER UTAMA UNTUK EFEK SHAKE (GUNCANG) --- */
        .jj-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }

        /* --- TEKS TYPOGRAPHY GAYA JJ BERGELOMBANG & GLITCH --- */
        .jj-title {
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 4px 4px 0px var(--neon-pink), -4px -4px 0px var(--neon-cyan);
            margin-bottom: 5px;
            transform: scale(1);
            transition: transform 0.1s ease-out;
        }

        .jj-subtitle {
            font-size: 1.5rem;
            letter-spacing: 8px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 10px var(--neon-cyan);
            margin-bottom: 40px;
        }

        /* --- TOMBOL MIRIP TOMBOL PLAY PRESET AM (ALIGHT MOTION) --- */
        .btn-jj {
            padding: 20px 60px;
            font-size: 1.3rem;
            color: #fff;
            background: linear-gradient(135deg, var(--neon-pink) 0%, #7209b7 100%);
            border: 4px solid #fff;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 0 30px var(--neon-pink);
            transform: skewX(-10deg); /* Gaya miring tajam preset kekinian */
            transition: all 0.2s ease;
        }

        .btn-jj:hover {
            transform: skewX(-10deg) scale(1.1);
            box-shadow: 0 0 50px var(--neon-cyan);
            background: var(--neon-cyan);
            color: var(--dark-club);
            border-color: var(--dark-club);
        }

        /* --- ANIMASI GUNCANG KELAS BERAT (HEAVY SHAKE) VIA CSS --- */
        .shake-active {
            animation: heavyShake 0.15s infinite;
        }

        @keyframes heavyShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 5px) rotate(-1deg); }
            40% { transform: translate(-5px, -8px) rotate(1deg); }
            60% { transform: translate(8px, 4px) rotate(0deg); }
            80% { transform: translate(6px, -5px) rotate(-1deg); }
            100% { transform: translate(-4px, 7px) rotate(1deg); }
        }

        /* Flash Animation trigger */
        .flash-active {
            animation: flashExplosion 0.25s ease-out forwards;
        }

        @keyframes flashExplosion {
            0% { opacity: 0.35; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="flash-overlay" id="flashLight"></div>

    <canvas id="jjCanvas"></canvas>

    <div class="jj-container" id="jjWrapper">
        <h1 class="jj-title" id="jjText">MENYALA ABANGKU</h1>
        <p class="jj-subtitle">PRESET AM // BASS BOOSTED</p>
        <button class="btn-ocean btn-jj" onclick="boostBass()">DJ FULL BEAT</button>
    </div>

    <script>
        const canvas = document.getElementById('jjCanvas');
        const ctx = canvas.getContext('2d');
        const jjWrapper = document.getElementById('jjWrapper');
        const flashLight = document.getElementById('flashLight');
        const jjText = document.getElementById('jjText');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Konfigurasi Ritme Ketukan JJ (Tempo Beats Per Minute fiktif)
        let bpm = 130; 
        let beatInterval = (60 / bpm) * 1000; // Hitung milidetik per ketukan bas
        let currentScale = 1;

        // Partikel neon yang berhamburan saat bas menyengat
        let particles = [];

        function createExplosionParticles() {
            for (let i = 0; i < 35; i++) {
                particles.push({
                    x: width / 2,
                    y: height / 2,
                    radius: Math.random() * 6 + 2,
                    color: Math.random() > 0.5 ? '#ff007f' : '#00f3ff',
                    speedX: (Math.random() - 0.5) * 25, // Semburan kecepatan tinggi
                    speedY: (Math.random() - 0.5) * 25,
                    alpha: 1,
                    decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        // --- SISTEM PEMICU OTOMATIS JEDAG JEDUG (BASS DROP TRIGGER) ---
        function triggerJedagJedug() {
            // 1. Tambah kelas guncang layar pada kontainer utama
            jjWrapper.classList.add('shake-active');
            
            // 2. Trigger kilatan lampu strobo putih
            flashLight.classList.remove('flash-active');
            void flashLight.offsetWidth; // Hack untuk me-restart animasi CSS
            flashLight.classList.add('flash-active');

            // 3. Efek Teks Membesar Mendadak (Zoom In/Out Beat)
            currentScale = 1.3;
            jjText.style.transform = `scale(${currentScale})`;
            jjText.style.textShadow = `8px 8px 0px var(--neon-cyan), -8px -8px 0px var(--neon-pink)`;

            // 4. Semburkan partikel energi disko
            createExplosionParticles();

            // Hentikan guncangan sesaat setelah ketukan lewat (menghasilkan efek jeda/patah-patah khas JJ)
            setTimeout(() => {
                jjWrapper.classList.remove('shake-active');
                jjText.style.transform = 'scale(1)';
                jjText.style.textShadow = `4px 4px 0px var(--neon-pink), -4px -4px 0px var(--neon-cyan)`;
            }, 180);
        }

        // Jalankan loop ketukan bas konstan (Auto Jedag-Jedug)
        setInterval(triggerJedagJedug, beatInterval);

        // Fungsi manual jika tombol "DJ FULL BEAT" diklik user untuk ekstra guncangan
        function boostBass() {
            triggerJedagJedug();
            createExplosionParticles();
        }

        // --- LOOP VISUALIZER LATAR BELAKANG ---
        function drawJJScene() {
            // Efek background semi transparan agar menyisakan jejak bayangan kaku (Ghosting/Motion Blur Effect)
            ctx.fillStyle = 'rgba(5, 5, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // Reduksi skala teks perlahan menuju normal
            if (currentScale > 1) {
                currentScale -= 0.02;
                jjText.style.transform = `scale(${currentScale})`;
            }

            // Render dan Update Partikel Semburan Bass
            particles.forEach((p, index) => {
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedX *= 0.95; // Efek gesekan udara lambat
                p.speedY *= 0.95;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                    return;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.shadowBlur = 15;
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Menggambar Bar Equalizer Musik di Sisi Kiri & Kanan Layar
            ctx.save();
            let barCount = 12;
            let barWidth = 15;
            let barGap = 8;
            
            for (let i = 0; i < barCount; i++) {
                // Tinggi bar akan melompat ekstrem jika skala ketukan sedang aktif
                let randomHeight = Math.random() * 150 + (currentScale > 1.1 ? 250 : 30);
                
                ctx.fillStyle = i % 2 === 0 ? 'var(--neon-pink)' : 'var(--neon-cyan)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = ctx.fillStyle;

                // Bar Sisi Kiri
                ctx.fillRect(30 + (i * (barWidth + barGap)), height - randomHeight, barWidth, randomHeight);
                // Bar Sisi Kanan
                ctx.fillRect(width - 30 - (i * (barWidth + barGap)) - barWidth, height - randomHeight, barWidth, randomHeight);
            }
            ctx.restore();

            requestAnimationFrame(drawJJScene);
        }

        // Jalankan lantai dansa JJ
        drawJJScene();
    </script>
</body>
</html>
